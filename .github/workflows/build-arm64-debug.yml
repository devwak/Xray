name: Build arm64 Debug

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ master, main ]

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;30.0.16248370" --channel=3
          yes | sdkmanager --licenses || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build XrayCore + XrayHelper (arm64)
        run: |
          chmod +x buildXrayCore.sh buildXrayHelper.sh buildGo.sh || true
          ./buildXrayCore.sh arm64
          ./buildXrayHelper.sh arm64

      - name: Build Debug APK (arm64 only)
        run: |
          ./gradlew clean
          ./gradlew -PabiId=2 -PabiTarget=arm64-v8a assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xray-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
